<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 661" width="960" height="661" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.4">
<style>
  .ln { opacity: 0; animation: r 9.82s steps(1,end) infinite; }
  @keyframes r { 0% { opacity: 0 } 1% { opacity: 1 } 94% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
  .cur { animation: b 1s steps(1,end) infinite, r 9.82s steps(1,end) infinite; }
  @keyframes b { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
</style>
<rect width="960" height="661" rx="10" fill="#0D0D0D"/>
<rect width="960" height="34" rx="10" fill="#171715"/>
<rect y="24" width="960" height="10" fill="#171715"/>
<circle cx="20" cy="17" r="5" fill="#3A3A36"/>
<circle cx="38" cy="17" r="5" fill="#3A3A36"/>
<circle cx="56" cy="17" r="5" fill="#3A3A36"/>
<text x="480" y="21.5" fill="#8A8A82" font-size="11.5" text-anchor="middle" letter-spacing="1.4">openhog</text>
<text class="ln" style="animation-delay:0.00s"><tspan x="26.0" y="62" fill="#8A8A82">$ </tspan><tspan x="42.1" y="62" fill="#ECECE6">npx openhog explain --goal retention</tspan></text>
<text class="ln" style="animation-delay:0.16s"></text>
<text class="ln" style="animation-delay:0.32s"><tspan x="26.0" y="104" fill="#ECECE6" font-weight="700">  Lantern</tspan><tspan x="98.5" y="104" fill="#8A8A82"> · consumer</tspan></text>
<text class="ln" style="animation-delay:0.48s"><tspan x="26.0" y="125" fill="#8A8A82">  18k people · 968k events · 214 days of history</tspan></text>
<text class="ln" style="animation-delay:0.64s"></text>
<text class="ln" style="animation-delay:0.80s"><tspan x="26.0" y="167" fill="#C4F236" font-weight="700">  30/100</tspan><tspan x="90.4" y="167" fill="#8A8A82"> product health</tspan></text>
<text class="ln" style="animation-delay:0.96s"><tspan x="26.0" y="188" fill="#8A8A82">  5 critical · 5 worth fixing · 1 blind spot</tspan></text>
<text class="ln" style="animation-delay:1.12s"></text>
<text class="ln" style="animation-delay:1.28s"><tspan x="26.0" y="230" fill="#ECECE6" font-weight="700">  YOUR GOAL</tspan><tspan x="114.6" y="230" fill="#8A8A82">  Get people to come back</tspan></text>
<text class="ln" style="animation-delay:1.44s"><tspan x="26.0" y="251" fill="#8A8A82">  Week-1 retention: </tspan><tspan x="187.0" y="251" fill="#ECECE6" font-weight="700">8.9%</tspan><tspan x="219.2" y="251" fill="#8A8A82">   typical 15% to 45%</tspan></text>
<text class="ln" style="animation-delay:1.60s"></text>
<text class="ln" style="animation-delay:1.76s"><tspan x="26.0" y="293" fill="#E8705F">  ● CRITICAL</tspan></text>
<text class="ln" style="animation-delay:1.92s"><tspan x="26.0" y="314" fill="#ECECE6" font-weight="700">  1. 2 events have stopped arriving</tspan></text>
<text class="ln" style="animation-delay:2.08s"><tspan x="26.0" y="335" fill="#8A8A82">     save_toggle and share_click, last seen 7 days ago.</tspan></text>
<text class="ln" style="animation-delay:2.24s"><tspan x="26.0" y="356" fill="#8A8A82">     Any number that depends on them is currently wrong.</tspan></text>
<text class="ln" style="animation-delay:2.40s"></text>
<text class="ln" style="animation-delay:2.56s"><tspan x="26.0" y="398" fill="#E8705F">  ● CRITICAL</tspan><tspan x="122.6" y="398" fill="#7DD3D8">  ← your goal</tspan></text>
<text class="ln" style="animation-delay:2.72s"><tspan x="26.0" y="419" fill="#ECECE6" font-weight="700">  2. Only 8.9% of people come back after a week</tspan></text>
<text class="ln" style="animation-delay:2.88s"><tspan x="26.0" y="440" fill="#8A8A82">     Of 2,400 people, 214 were still active a week later.</tspan></text>
<text class="ln" style="animation-delay:3.04s"><tspan x="26.0" y="461" fill="#8A8A82">     Well below typical for a consumer app.</tspan></text>
<text class="ln" style="animation-delay:3.20s"></text>
<text class="ln" style="animation-delay:3.36s"><tspan x="26.0" y="503" fill="#C4F236" font-weight="700">     → Do this:</tspan></text>
<text class="ln" style="animation-delay:3.52s"><tspan x="26.0" y="524" fill="#ECECE6">       Stop working on acquisition. Watch ten session</tspan></text>
<text class="ln" style="animation-delay:3.68s"><tspan x="26.0" y="545" fill="#ECECE6">       replays of people who never returned.</tspan></text>
<text class="ln" style="animation-delay:3.84s"></text>
<text class="ln" style="animation-delay:4.00s"><tspan x="26.0" y="587" fill="#E8705F">  ● CRITICAL</tspan></text>
<text class="ln" style="animation-delay:4.16s"><tspan x="26.0" y="608" fill="#ECECE6" font-weight="700">  3. 78% of people who sign up never reach value</tspan></text>
<rect class="cur" x="26" y="617" width="8" height="15" fill="#C4F236" style="animation-delay:4.42s"/>
</svg>
